# Default pipeline configuration (Constitution Principle VI: nothing market- or
# provider-specific is hardcoded — this file is the single place to change it).
# No secrets belong here: credentials are referenced by env-var NAME in providers.yaml.

providers_file: providers.yaml # resolved relative to this file

datastore:
  db_path: data/research.sqlite
  lake_dir: data/lake
  reports_dir: data/reports

# All four ONS submarkets (SE/CO, S, NE, N): spot (CMO->PLD proxy), reservoir
# (EAR % of max), and inflow (ENA % of long-term mean) — cross-submarket
# relative-value is the classic BR power trade. Proxy caveats in providers.yaml.
# NOTE: BR_POWER_SE_FWD_M1/M3 (power forwards) were removed 2026-07-21: no free
# public source exists (BR power forwards trade OTC), and their synthetic sample
# series only produced synthetic-labeled theses that crowded out the real
# instruments. Restore from git history if a real forward source is onboarded.
instrument_universe:
  - key: BR_POWER_SE_SPOT
    category: spot
    description: SE/CO daily spot power price (ONS CMO daily mean, PLD-proxy, real)
  - key: BR_POWER_S_SPOT
    category: spot
    description: South daily spot power price (ONS CMO daily mean, PLD-proxy, real)
  - key: BR_POWER_NE_SPOT
    category: spot
    description: Northeast daily spot power price (ONS CMO daily mean, PLD-proxy, real)
  - key: BR_POWER_N_SPOT
    category: spot
    description: North daily spot power price (ONS CMO daily mean, PLD-proxy, real)
  - key: BR_HYDRO_SE_RESERVOIR
    category: hydrology
    description: SE/CO aggregate reservoir level, % of max stored energy (ONS EAR, real)
  - key: BR_HYDRO_S_RESERVOIR
    category: hydrology
    description: South aggregate reservoir level, % of max stored energy (ONS EAR, real)
  - key: BR_HYDRO_NE_RESERVOIR
    category: hydrology
    description: Northeast aggregate reservoir level, % of max stored energy (ONS EAR, real)
  - key: BR_HYDRO_N_RESERVOIR
    category: hydrology
    description: North aggregate reservoir level, % of max stored energy (ONS EAR, real)
  - key: BR_ENA_SE_MLT
    category: inflow
    description: SE/CO inflow energy (ENA bruta) as % of long-term mean (ONS, real)
  - key: BR_ENA_S_MLT
    category: inflow
    description: South inflow energy (ENA bruta) as % of long-term mean (ONS, real)
  - key: BR_ENA_NE_MLT
    category: inflow
    description: Northeast inflow energy (ENA bruta) as % of long-term mean (ONS, real)
  - key: BR_ENA_N_MLT
    category: inflow
    description: North inflow energy (ENA bruta) as % of long-term mean (ONS, real)
  - key: BR_DI_1Y
    category: interest_rate
    description: >-
      Short-rate point. Currently BACEN SGS série 432 (Meta Selic, real), a labeled
      PROXY for the 1y DI vertex (no free stable-URL source for the B3 DI curve).
  - key: BRL_USD_FX
    category: fx
    description: BRL/USD exchange rate (BACEN SGS série 1, PTAX venda, real)

data_quality:
  freshness_tolerance_days: 7
  max_gap_days: 7
  outlier_zscore_threshold: 8.0
  max_cross_series_gap_days: 3

splits:
  discovery_fraction: 0.5
  refinement_fraction: 0.3
  # remaining fraction of the history is the final_evaluation period

screening:
  method: block_bootstrap
  n_bootstrap: 400
  block_size: 10
  alpha: 0.10
  multiplicity_method: benjamini_hochberg

backtesting:
  transaction_cost_bps: 5.0
  slippage_bps: 3.0
  financing_annual_rate: 0.11
  underperform_net_return_threshold: 0.0
  promotion_net_return_threshold: 0.0

refinement:
  max_refinement_depth_per_lineage: 2
  max_lineages_per_run: 5

generation:
  backend: gemini # or: deterministic_stub | anthropic
  model: gemini-2.5-flash # gemini-2.5-flash-lite is no longer available to new API keys
  # Vertex AI mode (Google Cloud credits) instead of the Developer API key.
  # Auth = Application Default Credentials: run `gcloud auth application-default login`
  # once (or set GOOGLE_APPLICATION_CREDENTIALS to a service-account JSON).
  # gcp_project may stay null if GOOGLE_CLOUD_PROJECT is exported instead.
  vertexai: true
  gcp_project: null # <- set your Google Cloud project ID here
  gcp_location: global
  api_key_env: GEMINI_API_KEY # used only when vertexai is false
  max_theses_per_cycle: 5

reproducibility:
  seed: 20260718 # omit / null to auto-generate (recorded on the cycle either way)
