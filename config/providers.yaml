      env_var_name: CCEE_PLACEHOLDER_TOKEN
      purpose: market_data
    base_url: https://dadosabertos.ccee.org.br
    endpoints:
    - category: spot
      path_template: /datastore/dump/3ca83769-de89-4dc5-84a7-0128167b594d?format=json
