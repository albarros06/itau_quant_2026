# Provider registry (Constitution Principle I). Each entry maps a provider_id to the
# connector module of the same name under energy_research/ingestion/providers/.
# Credentials are referenced by environment-variable NAME only — never a secret value.

market_data:
  - provider_id: sample_provider
    categories: [spot, forward_curve, hydrology, interest_rate, fx]
    options: {} # sample data is generated locally; clearly labeled synthetic
