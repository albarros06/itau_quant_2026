# Provider registry (Principle I / VI). Real open-data providers via the shared
# declarative connector - config only, no per-vendor code. All sources public
# (no credential block => no Authorization header sent).
#
# ALL FOUR submarkets (SE/CO, S, NE, N) are ingested from the same ONS files via
# instrument_key_map (id_subsistema -> canonical key); each year-file downloads
# once per run (connector payload cache), not once per instrument.
#
# Provenance & proxy notes (Principle IV):
# - BR_POWER_*_SPOT: ONS CMO (semi-hourly -> daily mean), CLAMPED to ANEEL's
#   yearly PLD floor / structural ceiling via value_clamp - the official PLD
#   construction (PLD = CMO bounded by the regulatory band) applied to the
#   public CMO feed. A labeled PROXY for CCEE's official PLD while
#   dadosabertos.ccee.org.br is behind a maintenance block (403 since
#   2026-07-19, commit 726f054). Yearly bands (R$/MWh, floor/structural
#   ceiling), ANEEL:
#     2020: 39.68/559.75   2021: 49.77/583.88   2022: 55.70/646.58
#     2023: 69.04/678.29   2024: 58.60/751.73   2025: 58.60/751.73
#     2026: 57.31/785.27
#   (sources: gov.br/aneel news 2019-2025; canalsolar.com.br; megawhat.energy)
# - BR_ENA_*_MLT: ONS ENA bruta as % of the long-term mean (MLT) - the standard
#   inflow-anomaly measure and the leading indicator CMO responds to.
# - BR_DI_1Y: BACEN SGS serie 432 (Selic target) - labeled proxy for the 1y DI
#   vertex (no free stable-URL source for the B3 DI curve exists).
# - Power forwards REMOVED (no free public source). See config/default.yaml.
#
# History window: 2020-01-01 -> today, bounded by ONS CMO's earliest S3
# year-file (2020). One endpoint per year-file; the connector concatenates all
# endpoints of a category. BACEN: ranges cap at 10y/request, 'ultimos/N' at
# N=20; dataInicial 01/01/2020 fits one request; no dataFinal = through today.

market_data:
- provider_id: bacen_sgs
  categories:
  - fx
  - interest_rate
  connector_kind: declarative
  options:
    provider_id: bacen_sgs
    base_url: https://api.bcb.gov.br
    endpoints:
    - category: fx
      method: GET
      path_template: /dados/serie/bcdata.sgs.1/dados?formato=json&dataInicial=01/01/2020
      field_mapping:
        instrument_key: '`"BRL_USD_FX"`'
        ts: data
        value: valor
        provenance: '`"real"`'
      ts_format: '%d/%m/%Y'
    - category: interest_rate
      method: GET
      path_template: /dados/serie/bcdata.sgs.432/dados?formato=json&dataInicial=01/01/2020
      field_mapping:
        instrument_key: '`"BR_DI_1Y"`'
        ts: data
        value: valor
        provenance: '`"real"`'
      ts_format: '%d/%m/%Y'
    pagination:
      mode: none
    timeout_seconds: 120
- provider_id: ons_ear
  categories:
