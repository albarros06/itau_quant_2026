# Provider registry (Principle I / VI). Real open-data providers are wired via the
# shared declarative connector — config only, no per-vendor code. All three real
# sources are public (no credential block => no Authorization header sent).
#
# Provenance & proxy notes (Principle IV):
# - BR_POWER_SE_SPOT comes from ONS's CMO (Custo Marginal de Operação, SE/CO,
#   semi-hourly aggregated to daily mean). CMO is the model input PLD is derived
#   from, NOT the official CCEE PLD — used as a labeled proxy while CCEE's open-data
#   portal (dadosabertos.ccee.org.br) is behind a maintenance block (403 since
#   2026-07-19; see commit 726f054). Swap back to ccee_pld_media_diaria when it
#   returns.
# - BR_DI_1Y comes from BACEN SGS série 432 (Selic target) — a short-rate proxy for
#   the 1y DI point, whose true source (B3 DI futures / ANBIMA ETTJ) has no free
#   stable-URL JSON endpoint.
# - Forward-curve series have NO free public source (power forwards trade OTC) and
#   remain synthetic via sample_provider, labeled as such end to end.
# - BACEN date note: SGS requires dataInicial (10y max per request) and 'ultimos/N'
#   is capped at N=20, so the window starts 01/01/2026 — aligned with the ONS
#   per-year 2026 files that bound the common range anyway. Omitting dataFinal
#   means "through today".

market_data:
- provider_id: sample_provider
  categories:
  - forward_curve
  options: {}

- provider_id: bacen_sgs
  categories:
  - fx
  - interest_rate
  connector_kind: declarative
  options:
    provider_id: bacen_sgs
    base_url: https://api.bcb.gov.br
    endpoints:
    - category: fx
      # SGS série 1: PTAX USD/BRL (venda), daily
      path_template: /dados/serie/bcdata.sgs.1/dados?formato=json&dataInicial=01/01/2026
      method: GET
      field_mapping:
        instrument_key: '`"BRL_USD_FX"`'
        ts: data
        value: valor
        provenance: '`"real"`'
      ts_format: '%d/%m/%Y'
    - category: interest_rate
      # SGS série 432: Meta Selic (Copom), daily — labeled proxy for BR_DI_1Y
      path_template: /dados/serie/bcdata.sgs.432/dados?formato=json&dataInicial=01/01/2026
      method: GET
      field_mapping:
        instrument_key: '`"BR_DI_1Y"`'
        ts: data
        value: valor
        provenance: '`"real"`'
      ts_format: '%d/%m/%Y'
    pagination:
      mode: none

- provider_id: ons_ear
  categories:
  - hydrology
  connector_kind: declarative
  options:
    provider_id: ons_ear
    base_url: https://ons-aws-prod-opendata.s3.amazonaws.com
    endpoints:
    - category: hydrology
      # EAR Diário por Subsistema, % of max stored energy, SE/CO rows only
      path_template: /dataset/ear_subsistema_di/EAR_DIARIO_SUBSISTEMA_2026.csv
      method: GET
      response_format: csv
      row_filter: nom_subsistema == 'SUDESTE'
      field_mapping:
        instrument_key: '`"BR_HYDRO_SE_RESERVOIR"`'
        ts: ear_data
        value: ear_verif_subsistema_percentual
        provenance: '`"real"`'
    pagination:
      mode: none

- provider_id: ons_cmo_daily_mean
  categories:
  - spot
  connector_kind: declarative
  options:
    provider_id: ons_cmo_daily_mean
    base_url: https://ons-aws-prod-opendata.s3.amazonaws.com
    endpoints:
    - category: spot
      # CMO Semi-Horário SE/CO -> daily mean (labeled PLD proxy; see header note)
      path_template: /dataset/cmo_tm/CMO_SEMIHORARIO_2026.csv
      method: GET
      response_format: csv
      row_filter: nom_subsistema == 'SUDESTE'
      aggregate: daily_mean
      field_mapping:
        instrument_key: '`"BR_POWER_SE_SPOT"`'
        ts: din_instante
        value: val_cmo
        provenance: '`"real"`'
    pagination:
      mode: none

qualitative_context:
- provider_id: sample_provider
  categories:
  - hydrology_outlook
  - macro_regime
  - news
  options: {}
